# Builds a debug APK on demand. Put this at .github/workflows/build-debug.yml.
# The repo's own build.yml is a disabled stub, so this is a separate file.
# The debug build installs next to the normal app (package ends in .debug).
name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: continuum-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
